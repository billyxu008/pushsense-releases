name: Redeploy billyxu.dev on release
on:
  release:
    types: [published, edited]
jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK secret not set; skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK" >/dev/null && echo "deploy hook fired"