name: Collect daily stats

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a fine-grained PAT with Administration:read unlocks the
          # traffic endpoints, which the built-in GITHUB_TOKEN cannot read.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/collect-stats.mjs

      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stats/history.json
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "stats: $(date -u +%Y-%m-%d)"
          git push
